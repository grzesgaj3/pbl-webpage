# =============================================================================
#  STACJA — panel opadów dla pbl-api (serwowanie statyczne)
#
#  Panel to same pliki statyczne. API działa w INNYM origin (adres ustawiasz
#  w config.js), więc nginx nie musi niczego proxować — wystarczy serwować pliki.
#  Pamiętaj tylko, aby po stronie API włączyć CORS dla adresu tego panelu:
#      CORS_ORIGINS=https://panel.example.com
#
#  Ustaw `root` na katalog z tym repo, `server_name` na swoją domenę.
#  Wklej do /etc/nginx/sites-available/pbl-webpage, dowiąż w sites-enabled,
#  potem `nginx -t && systemctl reload nginx`.
# =============================================================================

server {
    listen      80;
    listen      [::]:80;
    server_name panel.example.com;      # ← zmień na swoją domenę

    root  /var/www/pbl-webpage;         # ← zmień na katalog panelu
    index index.html;

    # --- Kompresja ----------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    # --- Nagłówki bezpieczeństwa -------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        DENY   always;
    add_header Referrer-Policy        no-referrer always;

    # --- Zasoby statyczne ---------------------------------------------------
    # config.js edytuje się ręcznie — bez cache, by zmiany działały od razu.
    location = /config.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Fonty i obrazy cache'ujemy długo.
    location ~* \.(woff2?|ttf|otf|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # JS/CSS zmieniają się razem z wydaniem — krótki cache + rewalidacja.
    location ~* \.(css|js)$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # --- SPA: wszystko inne do index.html -----------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# =============================================================================
#  Produkcja: HTTPS przez `certbot --nginx`, który dopisze blok 443
#  i przekierowanie z 80. Po dodaniu HTTPS pamiętaj, aby w CORS_ORIGINS po
#  stronie API widniał adres z https (zgodny z adresem panelu).
# =============================================================================
