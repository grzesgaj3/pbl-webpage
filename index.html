<!doctype html>
<html lang="pl" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Panel administracyjny i podglądowy sieci deszczomierzy LoRa (pbl-api)." />
    <meta name="theme-color" content="#0c6472" />
    <title>STACJA · panel opadów</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%230c6472' d='M16 3C11 10 6 15 6 20a10 10 0 0 0 20 0c0-5-5-10-10-17z'/%3E%3C/svg%3E"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script>
      // Ustawia motyw Bootstrapa przed pierwszym renderowaniem, aby uniknąć mignięcia.
      (function () {
        try {
          var pref = localStorage.getItem("pbl.theme") || "auto";
          var dark =
            pref === "dark" ||
            (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-bs-theme", dark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <a class="visually-hidden-focusable" href="#main">Przejdź do treści</a>
    <div id="app"></div>
    <div
      id="toasts"
      class="toast-container position-fixed bottom-0 end-0 p-3"
      role="status"
      aria-live="polite"
      aria-atomic="false"
    ></div>
    <div id="modal-root"></div>
    <noscript>
      <p class="p-4">Ten panel wymaga włączonego JavaScriptu.</p>
    </noscript>
    <script src="config.js"></script>
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
