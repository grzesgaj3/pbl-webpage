<!doctype html>
<html lang="pl" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Panel administracyjny i podglądowy sieci deszczomierzy LoRa (pbl-api)." />
    <meta name="theme-color" content="#0c6472" />
    <title>STACJA · panel opadów</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%230c6472' d='M16 3C11 10 6 15 6 20a10 10 0 0 0 20 0c0-5-5-10-10-17z'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script>
      // Ustawia motyw przed pierwszym renderowaniem, aby uniknąć mignięcia.
      (function () {
        try {
          var pref = localStorage.getItem("pbl.theme") || "auto";
          var dark =
            pref === "dark" ||
            (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Przejdź do treści</a>
    <div id="app" class="app" data-phase="boot"></div>
    <div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
    <div id="modal-root"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui">
        Ten panel wymaga włączonego JavaScriptu.
      </p>
    </noscript>
    <script src="config.js"></script>
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
